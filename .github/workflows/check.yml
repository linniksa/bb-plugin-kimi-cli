name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  cli-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: python -m pip install kimi-cli==1.50.0
      - run: npm install --prefix "$RUNNER_TEMP/kimi-node" --ignore-scripts --no-audit --no-fund @moonshot-ai/kimi-code@2.3.3
      - run: npm run test:cli
        env:
          KIMI_TEST_PYTHON: python
          KIMI_TEST_NODE: ${{ runner.temp }}/kimi-node/node_modules/.bin/kimi
